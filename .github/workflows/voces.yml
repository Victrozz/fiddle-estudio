# Prueba de voces: la misma frase con cada voz, para elegir de oído. Todo en GitHub
# (los modelos pesan varios GB: en el ordenador no caben). Deja los audios en una
# Release. Se lanza a mano: Actions → Probar voces.
#
# Ronda 1: Kokoro y Chatterbox con sus voces → sonaban a Sudamérica.
# Ronda 2: Piper (voces de España) y Chatterbox copiándolas → santa y davefx, las mejores;
#          las demás, sin entonación, y «fiddle» leído en inglés.
# Ronda 3: «fídel», Chatterbox con más entonación, Qwen3-TTS (voz a partir de una
#          descripción) y, si hay claves en los secretos, Azure y ElevenLabs.

name: Probar voces

on:
  workflow_dispatch:
    inputs:
      texto:
        description: "La frase que dicen todas («fiddle» se dice «fídel» solo)"
        default: "¿Sabes cuántos clientes no han vuelto este mes? Con fiddle lo ves en el móvil, y les avisas con un toque."
      release:
        description: "La Release donde se dejan"
        default: "Prueba-de-voces-3"
      elevenlabs:
        description: "Voces de ElevenLabs: «nombre=id,nombre=id» (vacío = ninguna)"
        default: ""

permissions:
  contents: write

env:
  TEXTO: ${{ inputs.texto }}
  RELEASE: ${{ inputs.release }}

jobs:
  # Las muestras de acento de España que copian Chatterbox y Qwen.
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
      # torch sin CUDA: aquí no hay tarjeta gráfica y la versión con CUDA pesa 2 GB más.
      - run: |
          pip install -q torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile "piper-tts==1.8.0"
      - run: python scripts/voces/con_kokoro.py
        env:
          KOKORO_VOCES: em_santa
      - run: python scripts/voces/con_piper.py
        env:
          PIPER_VOCES: davefx
      - uses: actions/upload-artifact@v4
        with:
          name: voces-muestras
          path: out/voces/

  chatterbox:
    needs: muestras
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: voces-muestras
          path: out/voces/
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7
      - run: python scripts/voces/con_chatterbox.py
        env:
          MUESTRAS: como-davefx=out/voces/piper-davefx.wav@0.4,como-davefx-mas-vivo=out/voces/piper-davefx.wav@0.75,como-santa-mas-vivo=out/voces/kokoro-em_santa.wav@0.75
      - uses: actions/upload-artifact@v4
        with:
          name: voces-chatterbox
          path: out/voces/chatterbox-*.wav

  qwen:
    needs: muestras
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: voces-muestras
          path: out/voces/
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts==0.1.1
      - run: python scripts/voces/con_qwen.py
      - uses: actions/upload-artifact@v4
        with:
          name: voces-qwen
          path: out/voces/qwen-*.wav

  # Solo si están los secretos (los pone Víctor en Settings → Secrets → Actions).
  de-pago:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOCES: ${{ inputs.elevenlabs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/voces/con_azure.py
      - run: python scripts/voces/con_elevenlabs.py
      - run: mkdir -p out/voces && touch out/voces/.vacio
      - uses: actions/upload-artifact@v4
        with:
          name: voces-de-pago
          path: out/voces/
          include-hidden-files: false
          if-no-files-found: ignore

  publicar:
    needs: [muestras, chatterbox, qwen, de-pago]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voces-*
          merge-multiple: true
          path: voces/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Nombre de Release raro: $RELEASE"; exit 1; }
          ls -la voces/
          shopt -s nullglob
          AUDIOS=(voces/*.wav voces/*.mp3)
          NOTAS="Prueba de voces. La frase: «$TEXTO» («fiddle» dicho «fídel»). piper-davefx y kokoro-em_santa: las muestras de acento de España. chatterbox-*: Chatterbox copiándolas (las «mas-vivo», con más entonación). qwen-*: Qwen3-TTS, voces hechas a partir de una descripción. azure-* y elevenlabs-*: solo si hay claves. Ninguna es de una persona."
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            gh release upload "$RELEASE" "${AUDIOS[@]}" --clobber
            gh release edit "$RELEASE" --notes "$NOTAS"
          else
            gh release create "$RELEASE" "${AUDIOS[@]}" --title "$RELEASE" --notes "$NOTAS" --prerelease
          fi

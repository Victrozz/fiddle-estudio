# Prueba de voces gratis: la misma frase con cada voz, para elegir de oído. Todo en
# GitHub (los modelos pesan varios GB: en el ordenador no caben). Deja los WAV en una
# Release. Se lanza a mano: Actions → Probar voces.
#
# Ronda 1 (Prueba-de-voces): Kokoro y Chatterbox con sus voces → sonaban a Sudamérica.
# Ronda 2 (Prueba-de-voces-2): Piper (voces de España) y Chatterbox copiando su acento.

name: Probar voces

on:
  workflow_dispatch:
    inputs:
      texto:
        description: "La frase que dicen todas"
        default: "¿Sabes cuántos clientes no han vuelto este mes? Con fiddle lo ves en el móvil, y les avisas con un toque."
      release:
        description: "La Release donde se dejan"
        default: "Prueba-de-voces-2"
      exageracion:
        description: "Chatterbox: lo expresiva que sale (0,5 de serie; más bajo, más tranquila)"
        default: "0.4"

permissions:
  contents: write

env:
  TEXTO: ${{ inputs.texto }}
  RELEASE: ${{ inputs.release }}

jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
      # torch sin CUDA: aquí no hay tarjeta gráfica y la versión con CUDA pesa 2 GB más.
      - run: |
          pip install -q torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro==0.9.4" soundfile
      - run: python scripts/voces/con_kokoro.py
        env:
          KOKORO_VOCES: em_santa
      - uses: actions/upload-artifact@v4
        with:
          name: voces-kokoro
          path: out/voces/

  piper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "piper-tts==1.8.0"
      - run: python scripts/voces/con_piper.py
      - uses: actions/upload-artifact@v4
        with:
          name: voces-piper
          path: out/voces/

  chatterbox:
    needs: [kokoro, piper]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: voces-*
          merge-multiple: true
          path: out/voces/
      - run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7
      - run: python scripts/voces/con_chatterbox.py
        env:
          MUESTRAS: como-santa=out/voces/kokoro-em_santa.wav,como-davefx=out/voces/piper-davefx.wav,como-sharvard-mujer=out/voces/piper-sharvard-mujer.wav
          EXAGERACION: ${{ inputs.exageracion }}
      - uses: actions/upload-artifact@v4
        with:
          name: voces-chatterbox
          path: out/voces/chatterbox-*.wav

  publicar:
    needs: [kokoro, piper, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: voces-*
          merge-multiple: true
          path: voces/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Nombre de Release raro: $RELEASE"; exit 1; }
          ls -la voces/
          NOTAS="Prueba de voces gratis. La frase: «$TEXTO». piper-*: voces entrenadas con gente de España. kokoro-em_santa: la de Kokoro con acento de España. chatterbox-como-*: Chatterbox copiando la voz y el acento de esas. Ninguna es de una persona."
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            gh release upload "$RELEASE" voces/*.wav --clobber
            gh release edit "$RELEASE" --notes "$NOTAS"
          else
            gh release create "$RELEASE" voces/*.wav --title "$RELEASE" --notes "$NOTAS" --prerelease
          fi

# La voz de uno o varios vídeos, en GitHub: lee src/videos/<id>/locucion.json, la
# dice con Azure (las voces de scripts/voces/elegidas.json) y sube al repo el audio
# (public/voz/<id>/) y los tiempos (src/videos/<id>/tiempos.json). Necesita los
# secretos AZURE_SPEECH_KEY y AZURE_SPEECH_REGION (Settings → Secrets → Actions).
# Se lanza a mano: Actions → Locutar, o `gh workflow run locutar.yml -f ids="<id> <id>"`.

name: Locutar

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Los ids de los vídeos, separados por espacios"
        required: true

permissions:
  contents: write

jobs:
  locutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IDS: ${{ inputs.ids }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar
        run: |
          [[ "$IDS" =~ ^[A-Za-z0-9\ -]+$ ]] || { echo "Ids raros: $IDS"; exit 1; }
          [ -n "$AZURE_SPEECH_KEY" ] || { echo "Falta el secreto AZURE_SPEECH_KEY"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/voces/locutar.mjs $IDS
      - name: Subir la voz al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/voz src/videos
          git diff --cached --quiet && { echo "Nada nuevo"; exit 0; }
          git commit -m "Voz de: $IDS"
          git push
